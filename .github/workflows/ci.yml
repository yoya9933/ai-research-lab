name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Check reference evaluation
        run: python -m lab evaluate --module lab.solutions --require-all-pass
      - name: Record baseline and first chat attempt
        run: |
          python -m lab evaluate --module lab.buggy
          python -m lab evaluate --module lab.attempt_001
      - name: Verify post-commit follow-up cases
        run: |
          python -m lab evaluate --module lab.buggy --suite followup
          python -m lab evaluate --module lab.attempt_001 --suite followup
          python -m lab evaluate --module lab.solutions --suite followup --require-all-pass
      - name: Compare candidate and baseline
        run: |
          python -m lab evaluate --module lab.buggy --output results/baseline.json
          python -m lab evaluate --module lab.attempt_001 --output results/attempt.json
          python -m lab.report results/baseline.json results/attempt.json
      - name: Check pinned external starter baseline
        run: python -m benchmarks.exercism.runner starter --output results/exercism-starter.json
      - name: Verify external exercise completion and compare to starter
        run: |
          python -m benchmarks.exercism.runner attempt_001 --output results/exercism-attempt.json --require-all-pass
          python -m lab.report results/exercism-starter.json results/exercism-attempt.json
      - name: Score post-freeze external tests
        run: |
          python -m benchmarks.exercism.runner starter_002 --output results/starter_002.json
          python -m benchmarks.exercism.runner attempt_002 --output results/attempt_002.json
          python -m lab.report results/starter_002.json results/attempt_002.json
      - name: Reproduce pinned upstream humanize issue 30
        run: python -m benchmarks.bugs.humanize_30.reproduce
      - name: Verify historical issue candidate patch
        run: python -m benchmarks.bugs.humanize_30.reproduce --candidate
      - name: Reproduce independent humanize non-finite input issue 333
        run: python -m benchmarks.bugs.humanize_333.reproduce
