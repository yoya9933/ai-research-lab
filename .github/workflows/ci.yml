name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.11'
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Check reference evaluation
        run: python -m lab evaluate --module lab.solutions --require-all-pass
      - name: Record baseline and first chat attempt
        run: |
          python -m lab evaluate --module lab.buggy
          python -m lab evaluate --module lab.attempt_001
      - name: Verify post-commit follow-up cases
        run: |
          python -m lab evaluate --module lab.buggy --suite followup
          python -m lab evaluate --module lab.attempt_001 --suite followup
          python -m lab evaluate --module lab.solutions --suite followup --require-all-pass
      - name: Compare candidate and baseline
        run: |
          python -m lab evaluate --module lab.buggy --output results/baseline.json
          python -m lab evaluate --module lab.attempt_001 --output results/attempt.json
          python -m lab.report results/baseline.json results/attempt.json
      - name: Check pinned external starter baseline
        run: python -m benchmarks.exercism.runner starter --output results/exercism-starter.json
      - name: Verify external exercise completion and compare to starter
        run: |
          python -m benchmarks.exercism.runner attempt_001 --output results/exercism-attempt.json --require-all-pass
          python -m lab.report results/exercism-starter.json results/exercism-attempt.json
      - name: Score post-freeze external tests
        run: |
          python -m benchmarks.exercism.runner starter_002 --output results/starter_002.json
          python -m benchmarks.exercism.runner attempt_002 --output results/attempt_002.json
          python -m lab.report results/starter_002.json results/attempt_002.json
      - name: Reproduce pinned upstream humanize issue 30
        run: python -m benchmarks.bugs.humanize_30.reproduce
      - name: Verify historical issue candidate patch
        run: python -m benchmarks.bugs.humanize_30.reproduce --candidate
      - name: Reproduce independent humanize non-finite input issue 333
        run: python -m benchmarks.bugs.humanize_333.reproduce
      - name: Verify isolated issue 333 candidate and finite overflow guard
        run: python -m unittest tests.test_humanize_333_candidate -v
      - name: Reproduce independently reported humanize negative ordinal defect
        run: python -m benchmarks.bugs.humanize_486.reproduce
      - name: Verify isolated humanize negative-ordinal candidate and controls
        run: python -m unittest tests.test_humanize_486_candidate -v
      - name: Record post-freeze tokenize-rt edge observations
        run: python -m benchmarks.bugs.tokenize_rt_33.followup
      - name: Record secondary tokenize-rt roundtrip candidate
        run: python -m benchmarks.bugs.tokenize_rt_33.roundtrip
      - name: Replay accepted more-itertools chunked_even size bug on pinned excerpt
        run: python -m benchmarks.bugs.more_itertools_1342.reproduce
      - name: Check isolated more-itertools boundary candidate and error messages
        run: python -m unittest tests.test_more_itertools_1342_candidate -v
      - name: Check 372 post-freeze more-itertools property inputs
        run: python -m unittest tests.test_more_itertools_1342_followup -v
      - name: Reproduce accepted Pygments duplicate-regex optimizer defect
        run: python -m benchmarks.bugs.pygments_3190.reproduce
      - name: Validate isolated Pygments duplicate-keyword candidate and controls
        run: python -m unittest tests.test_pygments_3190_candidate -v
      - name: Replay original Pygments regression tests after frozen candidate
        run: python -m unittest tests.test_pygments_3190_upstream -v
      - name: Verify 144 post-freeze Pygments literal-language observations
        run: python -m unittest tests.test_pygments_3190_properties -v
