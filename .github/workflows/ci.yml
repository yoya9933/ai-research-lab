name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Check reference evaluation
        run: python -m lab evaluate --module lab.solutions --require-all-pass
